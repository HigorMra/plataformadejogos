function shell(content){app.innerHTML=`<header class="bar"><div class="wrap bar-inner"><div class="brand">arcade<b>.</b></div>${token?`<nav>${[['profile','Perfil'],['library','Meus jogos'],['achievements','Conquistas'],['shop','Loja (40)']].map(([id,label])=>`<button data-nav="${id}" class="${screen===id?'active':''}">${label}</button>`).join('')}</nav><span class="user-chip">Olá, <b>${esc(userName())}</b></span>`:''}</div></header><main class="wrap screen">${content}</main><footer class="wrap footer">Arcade · Plataforma de Jogos · Compras e pagamentos simulados para fins demonstrativos.</footer>`;app.querySelectorAll('[data-nav]').forEach(b=>b.onclick=()=>go(b.dataset.nav));}
function loginView(error=''){screen='login';shell(`<section class="auth-layout"><div class="auth-art"><div><div class="logo-mark">arcade.</div><h1>Seu próximo<br>mundo começa aqui.</h1><p class="muted">Entre para explorar jogos, montar sua biblioteca e desbloquear conquistas.</p></div><span class="note">Plataforma de Jogos · Demo</span></div><div class="auth-form"><h2>Bem-vindo de volta</h2><p class="sub">Use sua conta DummyJSON para entrar.</p><form id="login-form"><div class="field"><label for="username">Usuário</label><input id="username" name="username" autocomplete="username" placeholder="Digite seu usuário" value="michaelw" required></div><div class="field"><label for="password">Senha</label><input id="password" name="password" type="password" autocomplete="current-password" placeholder="Digite sua senha" value="michaelwpass" required></div><button class="btn primary full" type="submit">Entrar</button><div class="error" role="alert">${esc(error)}</div></form><p class="note">Conta de demonstração selecionada: <b>michaelw</b> / <b>michaelwpass</b>. Autenticação pela API DummyJSON.</p></div></section>`);document.querySelector('#login-form').onsubmit=login;}
async function login(e){e.preventDefault();const form=new FormData(e.currentTarget),button=e.currentTarget.querySelector('button');button.disabled=true;button.textContent='Entrando…';try{const r=await fetch('https://dummyjson.com/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:form.get('username'),password:form.get('password'),expiresInMins:30})});const d=await r.json();if(!r.ok)throw Error(d.message||'Não foi possível autenticar. Confira usuário e senha.');token=d.accessToken||d.token;localStorage.setItem('token',token);profile=d;await loadProfile();go('profile')}catch(err){button.disabled=false;button.textContent='Entrar';document.querySelector('.error').textContent=err.message||'Falha de conexão. Tente novamente.'}}
async function loadProfile(){if(!token){loginView();return false}try{const r=await fetch('https://dummyjson.com/auth/me',{headers:{Authorization:'Bearer '+token}});if(!r.ok)throw Error('Sessão expirada');profile=await r.json();return true}catch{token=null;localStorage.removeItem('token');loginView('Sua sessão expirou. Entre novamente.');return false}}
function go(s,data){screen=s;if(data)selectedGame=data;render()}
function render(){if(!token){loginView();return}if(screen==='profile')profileView();else if(screen==='library')libraryView();else if(screen==='achievements')achievementsView();else if(screen==='shop')shopView();else if(screen==='detail')detailView();else if(screen==='payment')paymentView();else if(screen==='confirmation')confirmationView();else profileView()}
function gameCard(g){const isOwned=owned.includes(g.id);return `<article class="game-card"><div class="game-art"><img src="${g.images[0]}" alt="Capa de ${esc(g.name)}" onerror="this.onerror=null;this.src='${artData(g.id-1,0)}'">${isOwned?'<span class="owned-tag">NA BIBLIOTECA</span>':`<span class="discount-tag">${g.id%3===0?'DESTAQUE':'JOGO'}</span>`}</div><div class="game-info"><div class="genre">${g.genre} · ${g.size} GB</div><h3>${esc(g.name)}</h3><div class="price-row"><span class="price">${brl(g.price)}</span><button class="btn" data-detail="${g.id}">${isOwned?'Abrir':'Detalhes'}</button></div></div></article>`}
function profileView(){const count=owned.length,achCount=owned.length;screen='profile';shell(`<section class="hero"><div><div class="note" style="color:var(--orange);text-transform:uppercase;letter-spacing:1.4px">Seu perfil</div><h1>Olá, ${esc(userName())}!</h1><p class="sub">Sua próxima aventura está a um clique de distância.</p></div><div class="hero-actions"><button class="btn" data-go="library">Meus jogos</button><button class="btn primary" data-go="shop">Explorar loja</button></div></section><div class="stats"><div class="stat"><b>${count}</b><span>jogos na biblioteca</span></div><div class="stat"><b>${achCount}/${count*3}</b><span>conquistas desbloqueadas</span></div><div class="stat"><b>${esc(profile?.email||'Conta conectada')}</b><span>e-mail da conta</span></div></div><div class="profile-grid"><section class="panel profile-card"><img class="avatar" src="${esc(profile?.image||artData(5,0))}" alt="Foto de perfil"><h3>Higor</h3><p>@${esc(profile?.username||'jogador')}</p><p>${esc(profile?.gender||'Jogador')}</p><button class="btn danger" style="margin-top:12px" id="logout">Sair da conta</button></section><section class="panel"><h2>Continue jogando</h2><p class="sub">Acesse sua biblioteca e veja os detalhes das suas conquistas.</p><div class="game-grid" style="grid-template-columns:repeat(2,minmax(0,1fr));margin-top:17px">${owned.slice(0,2).map(id=>gameCard(games[id-1])).join('')}</div><div class="hero-actions" style="margin-top:17px"><button class="btn" data-go="achievements">Ver conquistas</button><button class="btn" data-go="shop">Visitar loja</button></div></section></div>`);bindCommon();document.querySelector('#logout').onclick=()=>{token=null;profile=null;localStorage.removeItem('token');loginView()};bindDetails()}
function libraryView(){screen='library';const list=owned.map(id=>games.find(g=>g.id===id)).filter(Boolean);shell(`<div class="section-title"><div><h1>Meus jogos</h1><p>${list.length} jogo(s) na biblioteca</p></div><button class="btn primary" data-go="shop">+ Loja de jogos</button></div><div class="game-grid">${list.length?list.map(gameCard).join(''):'<div class="empty">Sua biblioteca está vazia. Visite a loja para encontrar um jogo.</div>'}</div>`);bindCommon();bindDetails()}
function achievementsView(){screen='achievements';const g=selectedGame||games.find(x=>owned.includes(x.id));if(!g){shell(`<h1>Conquistas</h1><p class="sub">Adicione jogos à biblioteca para acompanhar suas conquistas.</p><button class="btn primary" data-go="shop">Abrir loja</button>`);bindCommon();return}const unlocked=g.achievements.map((a,i)=>({...a,ok:i===0&&owned.includes(g.id)}));shell(`<div class="section-title"><div><h1>Conquistas do jogo</h1><p>${esc(g.name)} · lista demonstrativa</p></div><button class="quiet" data-go="library">← Voltar aos meus jogos</button></div><div class="achievement-list">${unlocked.map(a=>`<div class="achievement ${a.ok?'':'locked'}"><span class="icon">${a.ok?'🏆':'🔒'}</span><div><b>${esc(a.name)} · ${a.ok?'Desbloqueada':'Bloqueada'}</b><p>${esc(a.description)}</p></div></div>`).join('')}</div>`);bindCommon()}
function shopView(){screen='shop';const cats=['Todos','Ação','Aventura','RPG','FPS','Corrida','Estratégia','Indie'],shown=games.filter(g=>(filter==='Todos'||g.genre.includes(filter))&&(!searchText||g.name.toLowerCase().includes(searchText.toLowerCase())));shell(`<div class="section-title"><div><h1>Loja de jogos</h1><p>40 jogos · preços indicativos em BRL de vitrines digitais consultadas; variam por edição e promoção. Compras simuladas.</p></div><button class="quiet" data-go="library">← Meus jogos</button></div><div class="toolbar"><label class="search"><input id="search-games" type="search" placeholder="⌕ Buscar jogo..." value="${esc(searchText)}" aria-label="Buscar jogo"></label><span class="note">${shown.length} de 40 jogos</span></div><div class="filters">${cats.map(c=>`<button class="chip ${filter===c?'active':''}" data-filter="${c}">${c}</button>`).join('')}</div><div class="game-grid">${shown.length?shown.map(gameCard).join(''):'<div class="empty">Nenhum jogo corresponde à busca.</div>'}</div>`);bindCommon();document.querySelector('#search-games').oninput=e=>{searchText=e.target.value;shopView();const el=document.querySelector('#search-games');el.focus();el.setSelectionRange(searchText.length,searchText.length)};document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{filter=b.dataset.filter;shopView()});bindDetails()}
function detailView(){const g=selectedGame||games[0],isOwned=owned.includes(g.id);screen='detail';shell(`<div class="section-title"><div><p><button class="quiet" data-go="shop">← Voltar à loja</button></p></div></div><section class="detail-layout"><div><div class="gallery-main"><img id="hero-image" src="${g.images[0]}" alt="${esc(g.name)} — imagem principal" onerror="this.onerror=null;this.src='${artData(g.id-1,0)}'"></div></div><div class="detail-info"><span class="note">${esc(g.genre)} · Jogo #${g.id}</span><h1>${esc(g.name)}</h1><p class="desc">${esc(g.description)}</p><div class="meta"><div><small>TAMANHO</small><b>${g.size} GB</b></div><div><small>PREÇO</small><b>${brl(g.price)}</b></div><div><small>GÊNERO</small><b>${esc(g.genre)}</b></div></div>${isOwned?'<button class="btn full" disabled>✓ Já está na sua biblioteca</button>':`<button class="btn primary full" id="buy">Comprar · ${brl(g.price)}</button>`}<div class="section-title"><h2>Conquistas</h2></div><div class="achievement-list">${g.achievements.map((a,i)=>{const ok=i===0&&owned.includes(g.id);return `<div class="achievement ${ok?'':'locked'}"><span class="icon">${ok?'🏆':'🔒'}</span><div><b>${esc(a.name)} · ${ok?'Desbloqueada':'Bloqueada'}</b><p>${esc(a.description)}</p></div></div>`}).join('')}</div></div></section>`);bindCommon();document.querySelector('#buy')?.addEventListener('click',()=>{orderGame=g;payMethod='cartao';go('payment')})}
function paymentView(){screen='payment';const g=orderGame||selectedGame||games[0];shell(`<div class="pay-layout"><button class="quiet" data-go="detail">← Voltar ao jogo</button><h1 style="margin-top:14px">Pagamento</h1><p class="sub">Confira o pedido e selecione uma forma de pagamento.</p><div class="order-summary"><img src="${g.images[0]}" alt="Capa ${esc(g.name)}" onerror="this.onerror=null;this.src='${artData(g.id-1,0)}'"><div><b>${esc(g.name)}</b><span class="note">${g.size} GB · Pagamento simulado</span><br><b style="color:var(--orange)">${brl(g.price)}</b></div></div><div class="methods">${[['cartao','Cartão'],['pix','Pix'],['boleto','Boleto']].map(([id,l])=>`<button class="btn ${payMethod===id?'active':''}" data-method="${id}">${l}</button>`).join('')}</div><form id="pay-form"><div id="payment-fields"></div><div class="error" id="pay-error" role="alert"></div><button class="btn primary full" type="submit">Confirmar pagamento simulado</button></form><p class="note" style="text-align:center">Nenhuma cobrança real será realizada. Não informe dados bancários reais.</p></div>`);bindCommon();renderPaymentFields();document.querySelectorAll('[data-method]').forEach(b=>b.onclick=()=>{payMethod=b.dataset.method;paymentView()});document.querySelector('#pay-form').onsubmit=pay}
function renderPaymentFields(){const el=document.querySelector('#payment-fields');if(payMethod==='cartao')el.innerHTML=`<div class="field"><label for="holder">Nome no cartão</label><input id="holder" autocomplete="cc-name" placeholder="Nome como aparece no cartão" required></div><div class="field"><label for="card">Número do cartão</label><input id="card" inputmode="numeric" autocomplete="cc-number" maxlength="19" placeholder="0000 0000 0000 0000" required></div><div class="grid2"><div class="field"><label for="expiry">Validade</label><input id="expiry" autocomplete="cc-exp" maxlength="5" placeholder="MM/AA" required></div><div class="field"><label for="cvv">CVV</label><input id="cvv" inputmode="numeric" autocomplete="cc-csc" maxlength="4" placeholder="123" required></div></div>`;else if(payMethod==='pix')el.innerHTML=`<div class="panel"><b>Pagamento via Pix</b><p class="note">Ao confirmar, vamos simular a aprovação do pedido. Nenhum QR code ou transação real será criado.</p></div>`;else el.innerHTML=`<div class="panel"><b>Boleto demonstrativo</b><p class="note">A confirmação simulará a aprovação. Nenhum boleto será emitido.</p></div>`}
function pay(e){e.preventDefault();const error=document.querySelector('#pay-error');error.textContent='';if(payMethod==='cartao'){const n=document.querySelector('#card').value.replace(/\D/g,''),exp=document.querySelector('#expiry').value.trim(),cvv=document.querySelector('#cvv').value.replace(/\D/g,'');if(n.length!==16){error.textContent='O número do cartão deve ter 16 dígitos.';return}if(!/^\d{2}\/\d{2}$/.test(exp)){error.textContent='Informe a validade no formato MM/AA.';return}const month=Number(exp.slice(0,2));if(month<1||month>12){error.textContent='Informe um mês de validade entre 01 e 12.';return}if(cvv.length<3||cvv.length>4){error.textContent='O CVV deve ter 3 ou 4 dígitos.';return}if(!document.querySelector('#holder').value.trim()){error.textContent='Informe o nome no cartão.';return}}if(!owned.includes(orderGame.id)){owned.push(orderGame.id);localStorage.setItem('ownedGames',JSON.stringify(owned))}go('confirmation')}
function confirmationView(){screen='confirmation';const g=orderGame||games.find(x=>owned.includes(x.id));shell(`<section class="panel confirmation"><div class="check">✓</div><h1>Pedido confirmado!</h1><p class="sub">Pagamento simulado aprovado para <b>${esc(g.name)}</b>.</p><p class="note">Pedido #NP-${String(Date.now()).slice(-7)} · ${brl(g.price)} · ${payMethod.toUpperCase()}</p><div class="hero-actions" style="justify-content:center;margin-top:20px"><button class="btn primary" data-go="library">Ver em Meus jogos</button><button class="btn" data-go="shop">Voltar à loja</button></div></section>`);bindCommon()}
function bindCommon(){document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>go(b.dataset.go));document.querySelectorAll('[data-detail]').forEach(b=>b.onclick=()=>go('detail',games.find(g=>g.id===Number(b.dataset.detail))))}
function bindDetails(){document.querySelectorAll('[data-detail]').forEach(b=>b.onclick=()=>{const g=games.find(x=>x.id===Number(b.dataset.detail));selectedGame=g;if(owned.includes(g.id)&&screen==='library')go('achievements',g);else go('detail',g)})}
async function boot(){if(!token){loginView();return}if(await loadProfile())go('profile')}
boot();
</script></body></html>
